name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Playwright's own image, which carries the three browsers and the system libraries they need, so
    # no run waits on the package mirror for them (it twice took over half an hour). Its version is the
    # lockfile's.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # Verify takes about twenty-five minutes; the rest is room for a slow runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The checkout belongs to another user than the container's root; git is told to trust it.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The server's tools, which the ops tests run: SQLite's shell, rclone and shellcheck.
      - run: apt-get update && apt-get install -y --no-install-recommends sqlite3 rclone shellcheck
      - run: pnpm verify
