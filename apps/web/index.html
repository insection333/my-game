<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Idle Clash: a free browser idle game of lanes, forges and the fire, in an old northern march."
    />
    <title>Idle Clash</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e4e9e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121b1f" media="(prefers-color-scheme: dark)" />
    <!-- How a shared link to the game reads. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://idleclash.com/" />
    <meta property="og:title" content="Idle Clash" />
    <meta
      property="og:description"
      content="A free browser idle game of lanes, forges and the fire, in an old northern march."
    />
    <!-- Who is here is the first thing the page asks; ask while the script is still loading. -->
    <link rel="preload" href="/api/me" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
